spring:
  application:
    name: fanta-f1-app-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FANTAF1_AUTH_ISSUER_URI}

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /docs
  enable-spring-security: true
  show-actuator: true

logging:
  level:
    root: info

jolpica:
  base-url: https://api.jolpi.ca/ergast/f1/

open-f1:
  base-url: https://api.openf1.org
  api-version: v1
  rate-limit:
    max-rate-per-second: 3
    max-rate-per-minute: 30
    max-burst-per-minute: 30

notifications:
  lineup:
    close-reminder-time-before: 12h
pricing:
  enable: true
  dry-run: false
  rolling-window-size: 3
  driver-weight: 0.8
  team-weight: 0.2
  price-floor: 20.0
  price-ceiling: 85.0
  target-avg-price: 50.0
  max-avg-price-threshold: 52.0
