logging:
  level:
    root: info

firebase:
  app-name: fantaf1
  database-id: (default)
  storage-bucket: fantaf1-beitz25.firebasestorage.app
  project-id: fantaf1-beitz25
  firestore:
    pagination:
      query-limit: 100

google:
  genai:
    chat-model: 'gemini-flash-latest'
    default-output-tokens: 1000
    image-model: 'imagen-3.0-generate-002'
    api-key: ${GOOGLE_GENAI_API_KEY}
    chat-model-thinking: 'gemma-4-31b-it'
    default-thinking-budget: 1000

management:
  influx:
    metrics:
      export:
        enabled: false
seeding:
  drivers: false
  race-weekends: false

results-calculator:
  enable: true
  dry-run: false
  