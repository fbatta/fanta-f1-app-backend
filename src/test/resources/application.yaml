spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/fantaf1

google:
  genai:
    api-key: test-key
    chat-model: gemini-flash-latest
    default-output-tokens: 1000
    image-model: imagen-3.0-generate-002
    chat-model-thinking: gemma-4-31b-it
    default-thinking-budget: 1000

open-f1:
  base-url: https://api.openf1.org
  api-version: v1

jolpica:
  base-url: https://api.jolpi.ca/ergast/f1/

firebase:
  app-name: fantaf1
  project-id: fantaf1-beitz25
  credentials-path: /credentials/fakeServiceAccount.json
  database-id: (default)
  storage-bucket: fantaf1-beitz25.firebasestorage.app
  firestore:
    pagination:
      query-limit: 100

pricing:
  enable: true
  dry-run: false
  rolling-window-size: 3
  driver-weight: 0.8
  team-weight: 0.2
  price-floor: 20.0
  price-ceiling: 85.0
  target-avg-price: 50.0
  max-avg-price-threshold: 52.0
