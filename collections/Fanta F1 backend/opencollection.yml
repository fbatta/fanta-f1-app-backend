opencollection: 1.0.0

info:
  name: Fanta F1 backend
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: "{{oauthBaseUrl}}/realms/{{realm}}/protocol/openid-connect/auth"
    accessTokenUrl: "{{oauthBaseUrl}}/realms/{{realm}}/protocol/openid-connect/token"
    credentials:
      clientId: bruno-client
      clientSecret: "{{clientSecret}}"
      placement: body
    scope: profile
    pkce:
      disabled: true
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true
  variables:
    - name: baseUrl
      value: http://localhost:8082
    - name: oauthBaseUrl
      value: https://auth.battaglini.net
    - name: realm
      value: master
    - name: clientSecret
      value: bFZNvetelZia1BfBCK8IEAIiE08Ndqnq
bundled: false
extensions: {}
